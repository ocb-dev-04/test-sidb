# Entorno completo de revisión: SQL Server 2022 + API (.NET 8) + frontend (React servido por nginx).
# Uso: copiar .env.example a .env (opcional) y ejecutar `docker compose up --build`.
name: sb-solicitudes

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-SbSolicitudes#Dev2026}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__SolicitudesDatabase: Server=sqlserver,1433;Database=SBSolicitudes;User Id=sa;Password=${SQL_SA_PASSWORD:-SbSolicitudes#Dev2026};TrustServerCertificate=True;Encrypt=True
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-solo-desarrollo-docker-reemplazar-por-una-llave-segura}
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://localhost:5173
    ports:
      - "5080:8080"
    volumes:
      - api-data:/app/Data
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_API_BASE_URL: http://localhost:5080
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  sqlserver-data:
  api-data:
