name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('src/backend/Directory.Packages.props') }}
      - run: dotnet restore SB.Solicitudes.sln
      - run: dotnet build SB.Solicitudes.sln --no-restore -c Release
      - name: Pruebas unitarias y de arquitectura
        run: >
          dotnet test SB.Solicitudes.sln --no-build -c Release --filter "Category!=Integration"
          --logger trx --results-directory TestResults/unit
      - name: Pruebas de integración (SQL Server en Testcontainers)
        run: >
          dotnet test tests/SB.Solicitudes.Servicios.IntegrationTests --no-build -c Release
          --logger trx --results-directory TestResults/integration
      - name: Publica los resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: src/backend/TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Pruebas
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - run: npm run build
      - name: Publica los resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: src/frontend/test-results
          if-no-files-found: ignore

  docker:
    name: Docker (stack completo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    env:
      API_URL: http://localhost:5080
      DEVELOPMENT_API_URL: http://localhost:5081
      WEB_URL: http://localhost:8080
      DEMO_EMAIL: admin@solicitudes.local
      DEMO_PASSWORD: Demo2026*
      MAXIMUM_ATTEMPTS: 60
    steps:
      - uses: actions/checkout@v7
      - name: Construye y levanta SQL Server, API y frontend
        # docker-compose.e2e.yml solo sube el límite de intentos de login para la suite de Playwright.
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d
      - name: Espera a que la API esté sana
        run: |
          for attempt in $(seq 1 "$MAXIMUM_ATTEMPTS"); do
            if curl -fsS "$API_URL/health" > /dev/null && curl -fsS "$DEVELOPMENT_API_URL/health" > /dev/null; then
              echo "API de producción y de desarrollo sanas"; exit 0
            fi
            sleep 5
          done
          echo "La API no respondió a tiempo"; exit 1
      - name: Prueba de humo (login, datos semilla y frontend)
        run: |
          token=$(curl -fsS -X POST "$API_URL/api/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$DEMO_EMAIL\",\"password\":\"$DEMO_PASSWORD\"}" | jq -r '.accessToken')
          [ -n "$token" ] && [ "$token" != "null" ] || { echo "Login sin token"; exit 1; }
          entities=$(curl -fsS "$API_URL/api/entidades-gubernamentales?page=1&pageSize=1" \
            -H "Authorization: Bearer $token" | jq '.totalCount')
          [ "$entities" -gt 0 ] || { echo "Sin entidades gubernamentales"; exit 1; }
          curl -fsS "$WEB_URL/" > /dev/null
          proxied_status=$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/api/notificaciones/no-leidas/total")
          [ "$proxied_status" = "401" ] || { echo "El proxy /api del frontend no llega a la API ($proxied_status)"; exit 1; }
          curl -fsSL "$DEVELOPMENT_API_URL/scalar" > /dev/null
          production_status=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/scalar")
          [ "$production_status" != "200" ] || { echo "Producción no debe exponer Scalar"; exit 1; }
          echo "Login correcto, $entities entidades, frontend y proxy /api disponibles, Scalar solo en desarrollo"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Pruebas e2e (Playwright) contra el stack
        working-directory: src/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Publica el reporte y los vídeos e2e
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            src/frontend/e2e-report
            src/frontend/e2e-results
          if-no-files-found: ignore
      - name: Verifica que ningún contenedor corra como root
        run: |
          for service in sqlserver api api-dev frontend; do
            user_id=$(docker compose exec -T "$service" id -u)
            echo "$service corre con uid $user_id"
            [ "$user_id" != "0" ] || { echo "$service corre como root"; exit 1; }
          done
      - name: Registros de los contenedores
        if: failure()
        run: docker compose logs --no-color
      - name: Baja el stack
        if: always()
        run: docker compose down -v
