# Solo parches y versiones menores, agrupados por ecosistema: las mayores (React 19, zod 4, Node 26, .NET 9+...)
# cambian contratos y se evalúan a mano. MediatR queda en 12.x: desde la 13 requiere licencia comercial.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/src/backend", "/src/frontend"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      images:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
